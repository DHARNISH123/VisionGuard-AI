version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: visionguard-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: safe_password_123
      POSTGRES_DB: visionguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: visionguard-backend
    environment:
      - DATABASE_URL=postgresql://postgres:safe_password_123@db:5432/visionguard
      - SECRET_KEY=production-secret-key-change-this
      - UPLOAD_DIR=/app/uploads
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: visionguard-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Map compiled frontend bundle into nginx directory (requires building first, or sharing volume)
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: visionguard-frontend
    volumes:
      - frontend_dist:/app/dist

volumes:
  postgres_data:
  backend_uploads:
  frontend_dist:
